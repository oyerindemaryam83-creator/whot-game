<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whot admin</title>
<style>
body{font-family:system-ui,sans-serif;background:#26070b;color:#f1ece6;margin:0;padding:1rem;max-width:900px;margin:auto}
input,button{font:inherit;padding:.6rem;border-radius:6px;border:1px solid #fff4}
input{background:#ffffff11;color:inherit}button{background:#e3b23c;color:#2b0a0e;font-weight:700;border:0;cursor:pointer}
.cards{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0}.card{background:#4a0d14;padding:1rem;border-radius:10px;min-width:150px}
.card b{display:block;font-size:1.6rem;color:#e3b23c}table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:.4rem;border-bottom:1px solid #fff2;text-align:left}.err{color:#ff9d9d}
</style></head><body>
<h1>Whot admin</h1>
<p>Enter the ADMIN_KEY you started the server with. It is only sent to this server and is not stored.</p>
<form id="f"><input id="k" type="password" placeholder="Admin key" autocomplete="off"> <button>Load earnings</button></form>
<p id="err" class="err"></p>
<div id="out"></div>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err'), out = document.getElementById('out'); err.textContent = ''; out.replaceChildren();
  const r = await fetch('/api/admin/earnings', {headers: {'x-admin-key': document.getElementById('k').value}});
  if (!r.ok) return err.textContent = 'Access denied. Check the key, and that the server was started with ADMIN_KEY set.';
  const d = await r.json();
  const box = document.createElement('div'); box.className = 'cards';
  const card = (label, val) => { const c = document.createElement('div'); c.className = 'card'; const b = document.createElement('b'); b.textContent = val; c.append(b, label); box.append(c); };
  card('Total earned (chips)', Number(d.house.chips).toLocaleString());
  card('Games played', d.house.games);
  d.byKind.forEach(k => card(k.kind + ' (' + k.n + ')', Number(k.chips).toLocaleString()));
  const t = document.createElement('table');
  t.innerHTML = '<tr><th>Time</th><th>Type</th><th>Room</th><th>Player(s)</th><th>Amount</th></tr>';
  d.ledger.forEach(l => { const tr = t.insertRow(); [new Date(l.time).toLocaleString(), l.kind, l.room || '', l.username || '', l.amount].forEach(v => { tr.insertCell().textContent = v; }); });
  out.append(box, t);
};
</script></body></html>
